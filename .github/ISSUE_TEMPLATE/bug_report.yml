name: Bug report
description: Report a reproducible VoiceType Local preview problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not attach real private audio, transcripts, API keys, medical data, or memory exports. Use a neutral example.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 0.2.0-rc1
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Processing mode
      options:
        - Local default
        - Local Ollama correction
        - OpenAI text correction
        - OpenAI cloud transcription
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Neutral reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed personal audio, transcripts, secrets, and identifying data.
          required: true
